[load_balancers]
lb-frontend ansible_host=192.168.1.10

[frontends]
frontend1 ansible_host=192.168.1.20
frontend2 ansible_host=192.168.1.21

[backends]
backend1 ansible_host=192.168.1.30

[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/id_rsa