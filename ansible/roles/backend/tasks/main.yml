---
- name: Instalar dependencias del sistema
  apt:
    name:
      - python3
      - python3-pip
      - python3-venv
      - sqlite3
    state: present


- name: Crear directorio de la aplicación
  file:
    path: /opt/crud-backend
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"

- name: Copiar código del backend
  copy:
    src: "../../../backend/"
    dest: /opt/crud-backend/
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"

- name: Crear entorno virtual
  command:
    cmd: python3 -m venv venv
    chdir: /opt/crud-backend
  creates: /opt/crud-backend/venv

- name: Instalar dependencias Python
  pip:
    requirements: /opt/crud-backend/requirements.txt
    virtualenv: /opt/crud-backend/venv
    virtualenv_python: python3

- name: Configurar servicio systemd
  template:
    src: "crud-backend.service.j2"
    dest: /etc/systemd/system/crud-backend.service

- name: Recargar daemon de systemd
  systemd:
    daemon_reload: yes

- name: Iniciar servicio backend
  systemd:
    name: crud-backend
    state: started
    enabled: yes